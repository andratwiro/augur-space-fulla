# Push to main → this space is live in about a minute, AND its baked page chrome stays
# current with the engine on its own. No publish command to run and none to forget.
#
# Why this exists at all: in Augur a push and a publish are different acts. A push
# records content in git; a PUBLISH is what puts it in front of visitors, and until
# someone runs it the live site quietly lags the repo — everybody's own clone looks
# right, so nobody notices. That gap is fine for a working space where a person is
# already at their terminal. For this one it is not: it is a public demo whose whole
# job is to show what the repo contains, and the person who last pushed is often not the
# person who would have remembered to publish. So the two acts are joined HERE, in the
# space repo. It runs the ordinary `augur publish` client with an ordinary per-space
# token — same door, no key under the mat — so the shell's "one source of content"
# guarantee (GV_ENGINE_ONLY=1) is untouched.
#
# It ALSO closes the chrome-bake gap. Page-level chrome (the rail, the profile menu, the
# overlays, the responsive layout) is baked into each page at PUBLISH time and stamped as
# `builtWithEngine` in /_build.json; an engine bump refreshes the SERVING engine within a
# minute but leaves already-published pages on their old baked chrome until the space
# republishes. The `repository_dispatch` and `schedule` triggers below keep them
# converged: the deploy shell fires `engine-rebake` the moment it moves its engine pin
# (fast path), and the schedule self-heals if that dispatch is ever missed (backstop).
#
# ── SETUP (one secret, once) ──────────────────────────────────────────────────────
# AUGUR_TOKEN — a publish token scoped to THIS space, minted on the instance:
#   1. sign in to https://demo.augur.works as an admin
#   2. Admin → Tokens → mint one for this space (label it so a revoke is obvious)
#   3. gh secret set AUGUR_TOKEN -R andratwiro/augur-space-fulla
# Scope it to this space, not "*": this repo is public, and a star-scope token in a
# public repo's CI can write every space on the instance. Fork pull requests never
# receive it — that is why the triggers below are push / manual / dispatch / schedule
# only, and why pull_request must not be added.
#
# The target is NOT configured here. It comes from space.json `siteOrigin`, the one
# public fact a space repo knows about its instance — so a fork that repoints its
# space.json publishes to its own site and this file needs no edit.
name: Publish to the live site

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Build and diff against live, ship nothing"
        type: boolean
        default: false
  # The deploy shell POSTs this the moment it moves its engine pin, with the new engine
  # sha in client_payload.engine_sha, so this space re-bakes against exactly the engine
  # the instance just pinned. Not subject to GitHub's "cron disabled after 60 days idle."
  repository_dispatch:
    types: [engine-rebake]
  # Self-heal backstop for a missed dispatch: republish only if the live baked chrome
  # (builtWithEngine) has drifted from the serving engine (engine.sha). A no-drift run is
  # a curl + exit — it publishes nothing.
  schedule:
    - cron: "41 */6 * * *" # every 6h (offset minute — GitHub drops top-of-hour crons)

# Newest run wins. Cancelling is safe: a publish commits atomically at the end, so an
# interrupted run ships nothing at all, and the run that replaces it carries a tree that
# already includes whatever the cancelled one was going to send.
concurrency:
  group: publish
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is load-bearing, not caution. publish.mjs REFUSES a shallow clone,
      # because it reads each file's git history to date the cards and credit the editor.
      # Checked out first (unconditionally) because the plan step reads this space's own
      # space.json for its id and siteOrigin.
      - name: Check out this space
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: space

      # Decide, from the event, WHICH engine to bake and WHETHER to publish at all:
      #   push / workflow_dispatch → publish, engine at main.
      #   repository_dispatch(engine-rebake) → publish, engine at client_payload.engine_sha.
      #   schedule → self-heal: publish ONLY if live baked chrome drifted from the serving
      #     engine, and not while a working-tree (dirty) publish is live.
      - name: Plan (engine ref + whether to publish)
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          PAYLOAD_SHA: ${{ github.event.client_payload.engine_sha }}
        run: |
          set -uo pipefail
          ID="$(jq -r '.id' space/space.json)"
          SITE="$(jq -r '.siteOrigin // empty' space/space.json)"
          REF="main"; DO="yes"; REASON="publish (engine main)"
          case "$EVENT" in
            repository_dispatch)
              REF="${PAYLOAD_SHA:-main}"; REASON="engine-rebake @ ${REF:0:12}"
              ;;
            schedule)
              if [ -z "$SITE" ]; then echo "no siteOrigin in space.json — cannot self-heal"; DO="no";
              elif ! STAMP="$(curl -fsS --max-time 30 "$SITE/_build.json")"; then
                echo "site down / no stamp — skipping self-heal"; DO="no"
              else
                ENG="$(printf '%s' "$STAMP" | jq -r '.engine.sha // empty')"
                BW="$(printf '%s' "$STAMP" | jq -r --arg id "$ID" '.spaces[$id].builtWithEngine // empty')"
                DIRTY="$(printf '%s' "$STAMP" | jq -r --arg id "$ID" '.spaces[$id].dirty // false')"
                if [ "$DIRTY" = "true" ]; then
                  echo "live $ID is a working-tree publish — leaving it (self-heal skipped)"; DO="no"
                elif [ -n "$ENG" ] && [ "$BW" = "$ENG" ]; then
                  echo "$ID baked chrome already at engine ${ENG:0:12} — nothing to do"; DO="no"
                else
                  REF="${ENG:-main}"; REASON="self-heal ${BW:0:12}→${ENG:0:12}"
                fi
              fi
              ;;
          esac
          {
            echo "do=$DO"
            echo "ref=$REF"
            echo "reason=$REASON"
          } >> "$GITHUB_OUTPUT"
          echo "Plan: id=$ID do=$DO ref=$REF — $REASON"

      # The engine is public and carries no runtime dependencies, so there is nothing to
      # install. It is checked out at the ref the plan chose, so content is built by the
      # exact engine the instance is on.
      - name: Check out the engine
        if: steps.plan.outputs.do == 'yes'
        uses: actions/checkout@v4
        with:
          repository: andratwiro/augur
          ref: ${{ steps.plan.outputs.ref }}
          path: engine

      - uses: actions/setup-node@v4
        if: steps.plan.outputs.do == 'yes'
        with: { node-version: 22 }

      - name: Fail early if the publish token is missing
        if: steps.plan.outputs.do == 'yes'
        env:
          AUGUR_TOKEN: ${{ secrets.AUGUR_TOKEN }}
        run: |
          if [ -z "$AUGUR_TOKEN" ]; then
            echo "::error::AUGUR_TOKEN is not set — see the setup notes at the top of this workflow."
            exit 1
          fi

      # GV_SPACES_ROOT points AT this space rather than at a parent folder, so the build
      # mounts it at the root and does not go looking for a spaces/ dir. No AUGUR_ORIGIN:
      # with no deploy shell on disk the origin resolves to space.json `siteOrigin`.
      - name: Publish
        if: steps.plan.outputs.do == 'yes'
        working-directory: space
        env:
          AUGUR_TOKEN: ${{ secrets.AUGUR_TOKEN }}
          GV_SPACES_ROOT: ${{ github.workspace }}/space
        run: node ../engine/scripts/publish.mjs ${{ inputs.dry-run && '--dry-run' || '' }}
